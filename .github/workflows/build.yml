name: Build Kernel spes 4.19 BakaSU (Android 17)

on:
  workflow_dispatch:
  push:
    branches:
      - main-a17-sm8250-base-bakasu

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Build Kernel spes 4.19 BakaSU A17
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/muralivijay/kernel_xiaomi_spes/
          kernel-dir: msm-4.19
          kernel-branch: main-a17-sm8250-base-bakasu
          config: vendor/spes-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          aosp-clang-version: r596125
          extra-make-args: LLVM=1 LLVM_IAS=1  # ✅ Changed from 'extra-cmd' to 'extra-make-args'
          ksu: false
          ksu-other: true
          ksu-url: https://github.com/Baka-SU/BakaSU
          anykernel3: true
          anykernel3-url: https://github.com/muralivijay/AnyKernel3
